apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - data-service
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: data-service
          image: shinjimc/data-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
          env:
            - name: MONGO_URI
              value: mongodb://mongo:VMBoSXotYMaVvFSsYxDyulEAVmArGrlM@hopper.proxy.rlwy.net:53449/test?authSource=admin
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
spec:
  type: NodePort
  selector:
    app: data-service
  ports:
    - protocol: TCP
      port: 4001
      targetPort: 4001
      nodePort: 32001
