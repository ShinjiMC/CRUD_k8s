apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      labels:
        app: data-service
    spec:
      containers:
        - name: data-service
          image: shinjimc/data-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: ES_NODE
              value: http://elasticsearch:9200
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
spec:
  type: NodePort
  selector:
    app: data-service
  ports:
    - protocol: TCP
      port: 4001
      targetPort: 4001
      nodePort: 32001
